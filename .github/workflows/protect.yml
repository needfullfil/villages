
name: Protect Frontend

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: protect-frontend
  cancel-in-progress: false

jobs:
  protect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      # DIAGNOSTIC: Check every required file
      - name: Verify Project Files
        shell: bash
        run: |
          echo "======================================"
          echo "VIDHWAAN FILE VERIFICATION"
          echo "======================================"

          FILES=(
            "package.json"
            "scripts/protect.js"
            "index.html"
            "app.js"
            "market.html"
            "market.js"
            "market.css"
            "search.js"
            "main.css"
            "styles.css"
          )

          MISSING=0

          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "PASS: $file"
            else
              echo "MISSING: $file"
              MISSING=$((MISSING + 1))
            fi
          done

          echo "======================================"
          echo "TOTAL MISSING: $MISSING"
          echo "======================================"

          if [ "$MISSING" -gt 0 ]; then
            echo "Verification failed."
            exit 1
          fi

          echo "All required files are present."

      - name: Run Protection Pipeline
        run: npm run protect

      - name: Verify Output Files
        shell: bash
        run: |
          set -e

          test -f index.html
          test -f app.js
          test -f market.html
          test -f market.js
          test -f market.css
          test -f search.js
          test -f main.css
          test -f styles.css

          echo "All output files verified."

      - name: Show Repository Status
        run: |
          echo "Repository Status"
          git status

          echo
          echo "Changed Files"
          git diff --stat || true

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Optimize frontend assets"

      - name: Push Changes
        run: git push
